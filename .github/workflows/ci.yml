name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated from the schema rather than committed,
      # so it has to exist before anything is typechecked or built.
      - run: pnpm --filter @dealroom/api exec prisma generate

      - run: pnpm nx run-many -t typecheck --all

      - run: pnpm nx run-many -t test --all

      - run: pnpm nx run-many -t build --all
